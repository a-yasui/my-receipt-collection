version: '3.8'

networks:
  degg-develop-net:
    external: true

volumes:
  mysql_data:
  redis_data:

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: my-receipt-backend
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/nginx/default.conf:/etc/nginx/sites-enabled/default
      - ./docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    env_file:
      - .env.docker
    networks:
      - degg-develop-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.my-receipt-backend.rule=Host(`my-receipt.localhost`)"
      - "traefik.http.services.my-receipt.loadbalancer.server.port=80"
    depends_on:
      - mysql
      - redis

  frontend:
    image: node:18-alpine
    container_name: my-receipt-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env.docker
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - degg-develop-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.my-receipt-frontend.rule=Host(`my-receipt.localhost`)"
      - "traefik.http.services.my-receipt-frontend.loadbalancer.server.port=5173"
    depends_on:
      - backend

  mysql:
    image: mysql:8.5
    container_name: my-receipt-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - degg-develop-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: my-receipt-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - degg-develop-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5